{% extends "admin/change_form.html" %}

{% block extrahead %}
    {{ block.super }}
    <style>
        /* Дублируем кнопки вверху */
        .submit-row:first-of-type {
            display: flex !important;
            gap: 8px !important;
            padding: 12px 0 !important;
            border-bottom: 2px solid #79aec8 !important;
            margin-bottom: 20px !important;
            flex-wrap: wrap !important;
            position: sticky !important;
            top: 0 !important;
            background: white !important;
            z-index: 999 !important;
        }
        .submit-row:first-of-type .deletelink-box {
            margin-left: auto !important;
        }
        .submit-row:first-of-type input[type="submit"] {
            margin: 0 4px 0 0 !important;
            padding: 8px 16px !important;
            border-radius: 4px !important;
            border: 1px solid #ccc !important;
            cursor: pointer !important;
        }
        .submit-row:first-of-type input[type="submit"].default {
            background: #79aec8 !important;
            color: white !important;
            border-color: #79aec8 !important;
        }
        .submit-row:first-of-type .deletelink {
            background: #ba2121 !important;
            color: white !important;
            padding: 8px 16px !important;
            border-radius: 4px !important;
            text-decoration: none !important;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var submitRows = document.querySelectorAll('.submit-row');
                if (submitRows.length > 1) {
                    var topRow = submitRows[0];
                    var bottomRow = submitRows[1];

                    // Если верхняя строка пустая — копируем из нижней
                    if (topRow.children.length === 0 || topRow.textContent.trim() === '') {
                        topRow.innerHTML = bottomRow.innerHTML;

                        // Переназначаем обработчики для кнопок
                        var inputs = topRow.querySelectorAll('input[type="submit"], input[type="button"]');
                        inputs.forEach(function(input) {
                            var originalName = input.name;
                            var originalValue = input.value;
                            input.addEventListener('click', function(e) {
                                var form = this.closest('form');
                                if (form) {
                                    var hidden = document.createElement('input');
                                    hidden.type = 'hidden';
                                    hidden.name = originalName;
                                    hidden.value = originalValue;
                                    form.appendChild(hidden);
                                    form.submit();
                                }
                            });
                        });

                        // Переназначаем обработчик для ссылки "Удалить"
                        var deleteLink = topRow.querySelector('a.deletelink');
                        if (deleteLink) {
                            var originalHref = deleteLink.href;
                            deleteLink.addEventListener('click', function(e) {
                                window.location.href = originalHref;
                            });
                        }
                    }
                }
            }, 500);
        });
    </script>
{% endblock %}

{% block content %}
    {{ block.super }}
{% endblock %}
