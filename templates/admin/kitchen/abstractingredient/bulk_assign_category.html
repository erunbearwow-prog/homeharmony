{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="bulk_assign_category">
        <input type="hidden" name="select_across" value="0">
        <input type="hidden" name="index" value="0">

        {% for obj in queryset %}
        <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
        {% endfor %}

        <fieldset class="module aligned">
            <div class="form-row">
                <label style="font-weight: bold; display: block; margin-bottom: 10px;">
                    Выберите категорию для {{ queryset.count }} ингредиентов:
                </label>
                <select name="category_id" style="width: 100%; padding: 8px; font-size: 14px;">
                    <option value="">-- Выберите категорию --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </fieldset>

        <div class="submit-row">
            <input type="submit" value="Применить" class="default">
            <a href="{% url 'admin:kitchen_abstractingredient_changelist' %}" class="button">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
