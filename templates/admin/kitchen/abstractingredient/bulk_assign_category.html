{% extends "admin/base_site.html" %}
{% load i18n admin_urls static admin_modify %}

{% block content %}
<div class="module">
    <h2>{% trans "Назначить категорию выбранным абстрактным ингредиентам" %}</h2>
    <p>Вы выбрали {{ queryset|length }} абстрактных ингредиента(ов).</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <label for="category_id">{% trans "Категория:" %}</label>
            <select name="category_id" id="category_id">
                <option value="">---------</option>
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="submit-row">
            <input type="submit" name="apply" value="{% trans 'Применить категорию' %}" class="default">
        </div>
    </form>
</div>
{% endblock %}
