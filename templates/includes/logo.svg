<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241.67 241.97" width="100%" height="100%">
  <defs>
    <style>
      .part { transition: all 0.3s ease; cursor: pointer; }
      .part:hover { filter: brightness(1.08) drop-shadow(0 4px 12px rgba(0,0,0,0.1)); }
    </style>

    <!-- Определяем паттерны для изображений (если используются) -->
    {% if logo_colors.circle_fill_type == 'image' %}
    <pattern id="pattern-circle" patternUnits="userSpaceOnUse" width="100%" height="100%">
      <image href="{{ logo_colors.circle_fill }}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
    </pattern>
    {% endif %}

    {% if logo_colors.curved_top_fill_type == 'image' %}
    <pattern id="pattern-curved-top" patternUnits="userSpaceOnUse" width="100%" height="100%">
      <image href="{{ logo_colors.curved_top_fill }}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
    </pattern>
    {% endif %}

    {% if logo_colors.bottom_triangle_fill_type == 'image' %}
    <pattern id="pattern-bottom-triangle" patternUnits="userSpaceOnUse" width="100%" height="100%">
      <image href="{{ logo_colors.bottom_triangle_fill }}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
    </pattern>
    {% endif %}

    {% if logo_colors.left_top_fill_type == 'image' %}
    <pattern id="pattern-left-top" patternUnits="userSpaceOnUse" width="100%" height="100%">
      <image href="{{ logo_colors.left_top_fill }}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
    </pattern>
    {% endif %}

    {% if logo_colors.right_top_fill_type == 'image' %}
    <pattern id="pattern-right-top" patternUnits="userSpaceOnUse" width="100%" height="100%">
      <image href="{{ logo_colors.right_top_fill }}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
    </pattern>
    {% endif %}

    {% if logo_colors.curved_left_fill_type == 'image' %}
    <pattern id="pattern-curved-left" patternUnits="userSpaceOnUse" width="100%" height="100%">
      <image href="{{ logo_colors.curved_left_fill }}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
    </pattern>
    {% endif %}

    {% if logo_colors.curved_right_fill_type == 'image' %}
    <pattern id="pattern-curved-right" patternUnits="userSpaceOnUse" width="100%" height="100%">
      <image href="{{ logo_colors.curved_right_fill }}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
    </pattern>
    {% endif %}

    <mask id="circle-mask">
      <rect width="250" height="250" fill="white" />
      <circle cx="102.15" cy="139.53" r="71.73" fill="black" />
    </mask>

    <clipPath id="clip-curved-1">
      <polygon points="65.02,0.97 0.71,240.97 240.71,176.66" />
      <rect x="0" y="0" width="250" height="139.53" />
    </clipPath>

    <clipPath id="clip-curved-2">
      <polygon points="0.71,240.97 240.71,176.66 65.02,0.97" />
      <polygon points="0.71,139.53 102.15,139.53 0.71,240.97" />
    </clipPath>

    <clipPath id="clip-curved-3">
      <polygon points="240.71,176.66 65.02,0.97 0.71,240.97" />
      <polygon points="102.15,139.53 240.71,139.53 240.71,240.97 0.71,240.97" />
    </clipPath>
  </defs>

  <!-- 1. КРУГ -->
  <circle
    cx="102.15" cy="139.53" r="71.73"
    fill="{% if logo_colors.circle_fill_type == 'image' %}url(#pattern-circle){% else %}{{ logo_colors.circle_fill }}{% endif %}"
    opacity="{{ logo_colors.circle_opacity }}"
    stroke="{{ logo_colors.circle_stroke }}"
    stroke-width="{{ logo_colors.circle_stroke_width }}"
    stroke-opacity="{{ logo_colors.stroke_opacity }}"
    stroke-dasharray="{{ logo_colors.circle_stroke_dasharray|default:logo_colors.stroke_dasharray }}"
    stroke-linecap="{{ logo_colors.stroke_linecap }}"
    stroke-linejoin="{{ logo_colors.stroke_linejoin }}"
  />

  <!-- 2. Верхний криволинейный треугольник -->
  <polygon
    points="65.02,0.97 0.71,240.97 240.71,176.66"
    fill="{% if logo_colors.curved_top_fill_type == 'image' %}url(#pattern-curved-top){% else %}{{ logo_colors.curved_top_fill }}{% endif %}"
    clip-path="url(#clip-curved-1)"
    mask="url(#circle-mask)"
    stroke="{{ logo_colors.stroke_color }}"
    stroke-width="{{ logo_colors.stroke_width }}"
    stroke-opacity="{{ logo_colors.stroke_opacity }}"
    stroke-dasharray="{{ logo_colors.stroke_dasharray }}"
    stroke-linecap="{{ logo_colors.stroke_linecap }}"
    stroke-linejoin="{{ logo_colors.stroke_linejoin }}"
  />

  <!-- 3. Нижний треугольник -->
  <polygon
    points="0.71,240.97 240.71,240.97 240.71,176.66"
    fill="{% if logo_colors.bottom_triangle_fill_type == 'image' %}url(#pattern-bottom-triangle){% else %}{{ logo_colors.bottom_triangle_fill }}{% endif %}"
    stroke="{{ logo_colors.stroke_color }}"
    stroke-width="{{ logo_colors.stroke_width }}"
    stroke-opacity="{{ logo_colors.stroke_opacity }}"
    stroke-dasharray="{{ logo_colors.stroke_dasharray }}"
    stroke-linecap="{{ logo_colors.stroke_linecap }}"
    stroke-linejoin="{{ logo_colors.stroke_linejoin }}"
  />

  <!-- 4. Левый верхний треугольник -->
  <polygon
    points="0.71,0.97 65.02,0.97 0.71,240.97"
    fill="{% if logo_colors.left_top_fill_type == 'image' %}url(#pattern-left-top){% else %}{{ logo_colors.left_top_fill }}{% endif %}"
    stroke="{{ logo_colors.stroke_color }}"
    stroke-width="{{ logo_colors.stroke_width }}"
    stroke-opacity="{{ logo_colors.stroke_opacity }}"
    stroke-dasharray="{{ logo_colors.stroke_dasharray }}"
    stroke-linecap="{{ logo_colors.stroke_linecap }}"
    stroke-linejoin="{{ logo_colors.stroke_linejoin }}"
  />

  <!-- 5. Правый верхний треугольник -->
  <polygon
    points="65.02,0.97 240.71,0.97 240.71,176.66"
    fill="{% if logo_colors.right_top_fill_type == 'image' %}url(#pattern-right-top){% else %}{{ logo_colors.right_top_fill }}{% endif %}"
    stroke="{{ logo_colors.stroke_color }}"
    stroke-width="{{ logo_colors.stroke_width }}"
    stroke-opacity="{{ logo_colors.stroke_opacity }}"
    stroke-dasharray="{{ logo_colors.stroke_dasharray }}"
    stroke-linecap="{{ logo_colors.stroke_linecap }}"
    stroke-linejoin="{{ logo_colors.stroke_linejoin }}"
  />

  <!-- 6. Левый криволинейный треугольник -->
  <polygon
    points="0.71,240.97 240.71,176.66 65.02,0.97"
    fill="{% if logo_colors.curved_left_fill_type == 'image' %}url(#pattern-curved-left){% else %}{{ logo_colors.curved_left_fill }}{% endif %}"
    clip-path="url(#clip-curved-2)"
    mask="url(#circle-mask)"
    stroke="{{ logo_colors.stroke_color }}"
    stroke-width="{{ logo_colors.stroke_width }}"
    stroke-opacity="{{ logo_colors.stroke_opacity }}"
    stroke-dasharray="{{ logo_colors.stroke_dasharray }}"
    stroke-linecap="{{ logo_colors.stroke_linecap }}"
    stroke-linejoin="{{ logo_colors.stroke_linejoin }}"
  />

  <!-- 7. Правый криволинейный треугольник -->
  <polygon
    points="240.71,176.66 65.02,0.97 0.71,240.97"
    fill="{% if logo_colors.curved_right_fill_type == 'image' %}url(#pattern-curved-right){% else %}{{ logo_colors.curved_right_fill }}{% endif %}"
    clip-path="url(#clip-curved-3)"
    mask="url(#circle-mask)"
    stroke="{{ logo_colors.stroke_color }}"
    stroke-width="{{ logo_colors.stroke_width }}"
    stroke-opacity="{{ logo_colors.stroke_opacity }}"
    stroke-dasharray="{{ logo_colors.stroke_dasharray }}"
    stroke-linecap="{{ logo_colors.stroke_linecap }}"
    stroke-linejoin="{{ logo_colors.stroke_linejoin }}"
  />

</svg>